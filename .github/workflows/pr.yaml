name: validate
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.26.0'
          cache: true

      - name: test
        run: make test

      - name: check license headers
        run: make checklicense

      - name: build
        run: make build
